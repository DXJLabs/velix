name: Run VEIL Durable Message Proof E2E

on:
  workflow_dispatch:
    inputs:
      acknowledge_real_prover:
        description: Run the real official message prover through the durable Part 6 pipeline
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: veil-durable-message-proof-e2e
  cancel-in-progress: false

jobs:
  durable-message-proof:
    name: Durable Official Message Proof
    if: ${{ inputs.acknowledge_real_prover }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veil
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d veil"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/veil
      STARKNET_SEPOLIA_RPC_URL: ${{ secrets.STARKNET_SEPOLIA_RPC_URL }}
      VEIL_POC_ACCOUNT_ADDRESS: ${{ secrets.VEIL_POC_ACCOUNT_ADDRESS }}
      VEIL_POC_ACCOUNT_PRIVATE_KEY: ${{ secrets.VEIL_POC_ACCOUNT_PRIVATE_KEY }}
      VEIL_POC_VIEWING_KEY: ${{ secrets.VEIL_POC_VIEWING_KEY }}
      PROVER_IMAGE: ghcr.io/dxjlabs/starknet-privacy-transaction-prover:privacy-0.14.3-rc.2-x86-64-v3

    steps:
      - name: Checkout VEIL source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            STARKNET_SEPOLIA_RPC_URL \
            VEIL_POC_ACCOUNT_ADDRESS \
            VEIL_POC_ACCOUNT_PRIVATE_KEY \
            VEIL_POC_VIEWING_KEY
          do
            if [ -z "${!name:-}" ]; then
              echo "A required durable message proof secret is unavailable."
              exit 1
            fi
          done

          echo "Required secrets are present; values are not displayed."

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y postgresql-client >/dev/null

      - name: Build pinned VEIL backend and SDK
        run: npm run build:backend

      - name: Apply isolated migrations
        shell: bash
        run: |
          set -euo pipefail

          for migration in backend/migrations/*.sql; do
            echo "Applying $(basename "$migration")"
            psql "$DATABASE_URL" \
              -v ON_ERROR_STOP=1 \
              -f "$migration" \
              >/dev/null
          done

          psql "$DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -c "
              SELECT table_name
              FROM information_schema.tables
              WHERE table_schema = 'public'
                AND table_name = 'veil_proof_results';
            "

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull saved transaction prover
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$PROVER_IMAGE"
          docker image inspect "$PROVER_IMAGE" >/dev/null
          echo "SAVED_PROVER_IMAGE_READY"

      - name: Start official transaction prover
        shell: bash
        run: |
          set -euo pipefail

          docker rm -f veil-durable-message-prover \
            >/dev/null 2>&1 || true

          docker run -d \
            --name veil-durable-message-prover \
            -p 3000:3000 \
            -e RPC_URL="$STARKNET_SEPOLIA_RPC_URL" \
            -e CHAIN_ID="SN_SEPOLIA" \
            -e PROVER_IP="0.0.0.0" \
            -e PROVER_PORT="3000" \
            -e MAX_CONCURRENT_REQUESTS="1" \
            -e MAX_QUEUED_REQUESTS="1" \
            -e MAX_CONNECTIONS="2" \
            -e COMPILED_CLASS_CACHE_SIZE="50" \
            -e PREFETCH_STATE="false" \
            -e RUST_LOG="info" \
            "$PROVER_IMAGE"

          ready=0

          for attempt in $(seq 1 90); do
            if [ "$(
              docker inspect \
                -f '{{.State.Running}}' \
                veil-durable-message-prover \
                2>/dev/null || true
            )" != "true" ]; then
              echo "The prover container stopped before becoming ready."
              exit 1
            fi

            response="$(
              curl -sS \
                --connect-timeout 2 \
                --max-time 5 \
                -X POST http://127.0.0.1:3000 \
                -H 'Content-Type: application/json' \
                -d '{
                  "jsonrpc":"2.0",
                  "id":1,
                  "method":"starknet_specVersion",
                  "params":[]
                }' \
                2>/dev/null || true
            )"

            if echo "$response" | grep -q '"result"'; then
              ready=1
              break
            fi

            echo "Waiting for prover: $attempt/90"
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "The prover did not become ready."
            exit 1
          fi

          echo "OFFICIAL_TRANSACTION_PROVER_READY"

      - name: Generate ephemeral durable message fixture
        id: fixture
        shell: bash
        env:
          VEIL_POC_PROVER_URL: http://127.0.0.1:3000
          VEIL_POC_GENERATE_PROOF: "true"
          VEIL_POC_SUBMIT_ONCHAIN: "false"
          VEIL_POC_RESOURCE_ESTIMATE_ONLY: "false"
          VEIL_POC_SHIELDED_MESSAGE_SUMMARY_PATH: ${{ runner.temp }}/veil-shielded-message-summary.json
          VEIL_POC_SHIELDED_MESSAGE_ERROR_PATH: ${{ runner.temp }}/veil-shielded-message-error.json
          VEIL_POC_DURABLE_FIXTURE_PATH: ${{ runner.temp }}/veil-real-message-proof-fixture.json
        run: |
          set -euo pipefail

          fixture="$RUNNER_TEMP/veil-real-message-proof-fixture.json"

          rm -f \
            "$fixture" \
            "$RUNNER_TEMP/veil-shielded-message-summary.json" \
            "$RUNNER_TEMP/veil-shielded-message-error.json"

          timeout 300m node --experimental-strip-types \
            tools/veil-official-shielded-message-runner.ts

          if [ ! -s "$fixture" ]; then
            echo "The ephemeral durable message fixture was not created."
            exit 1
          fi

          node --input-type=module - "$fixture" <<'NODE'
          import {
            readFile,
          } from "node:fs/promises";

          const fixturePath =
            process.argv[2];

          const fixture =
            JSON.parse(
              await readFile(
                fixturePath,
                "utf8",
              ),
            );

          if (
            JSON.stringify(
              Object.keys(fixture),
            )
            !== JSON.stringify([
              "schemaVersion",
              "idempotencyKey",
              "authenticatedSubject",
              "request",
            ])
            || fixture.schemaVersion
              !== "veil-real-message-proof-fixture-v1"
          ) {
            throw new Error(
              "The ephemeral durable message fixture schema is invalid.",
            );
          }

          console.log(
            "EPHEMERAL_DURABLE_MESSAGE_FIXTURE_VALID",
          );
          NODE

          chmod 600 "$fixture"
          echo "path=$fixture" >> "$GITHUB_OUTPUT"

      - name: Run durable message proof pipeline
        shell: bash
        env:
          VEIL_REAL_MESSAGE_FIXTURE: ${{ steps.fixture.outputs.path }}
        run: |
          set -euo pipefail

          random_base64() {
            node --input-type=module -e \
              'import { randomBytes } from "node:crypto"; process.stdout.write(randomBytes(48).toString("base64"));'
          }

          payload_key="$(
            node --input-type=module -e \
              'import { randomBytes } from "node:crypto"; process.stdout.write(randomBytes(32).toString("base64"));'
          )"

          export STARKNET_CHAIN_ID="SN_SEPOLIA"
          export STARKNET_RPC_URL="$STARKNET_SEPOLIA_RPC_URL"
          export VEIL_PROVER_URL="http://127.0.0.1:3000"
          export VEIL_PROVER_MODE="local"
          export VEIL_EXPERIMENTAL_DIRECT_PROVER="true"
          export VEIL_DISCOVERY_URL="http://127.0.0.1:3000/api/indexer/messages"
          export VEIL_PRIVACY_POOL_ADDRESS="0x03a91bc44040f4173f30f3233d3cb2510aa05a0b74c22a5ee8240a313a0c8de5"
          export VEIL_CHANNEL_HELPER_ADDRESS="0x6a687412a17064df67fbf8d62405b73e76b07117440b062fd8e144f4371a66d"
          export VEIL_PROVER_CONNECTION_TIMEOUT_MS="5000"
          export VEIL_PROVER_JOB_TIMEOUT_MS="3600000"
          export VEIL_PROVER_TOTAL_TIMEOUT_MS="7200000"
          export VEIL_PROVER_HEALTH_RETRIES="1"
          export VEIL_PROVER_JOB_RETRIES="0"
          export VEIL_PROVER_RETRY_BASE_MS="250"
          export VEIL_PROVER_RETRY_MAX_MS="5000"
          export VEIL_PROOF_PAYLOAD_ACTIVE_KEY_VERSION="v1"
          export VEIL_PROOF_PAYLOAD_KEYS="{\"v1\":\"$payload_key\"}"
          export VEIL_RATE_LIMIT_SECRET="$(random_base64)"
          export VEIL_PROOF_ACCESS_SECRET="$(random_base64)"
          export VEIL_PROOF_QUEUE_MAX_QUEUED_JOBS="10"
          export VEIL_PROOF_QUEUE_MAX_RUNNING_JOBS="1"
          export VEIL_PROOF_QUEUE_RECOVERY_BATCH_SIZE="10"
          export VEIL_PROOF_WORKER_NAME="github-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export VEIL_PROOF_WORKER_SECRET="$(random_base64)"
          export VEIL_PROOF_WORKER_LEASE_MS="120000"
          export VEIL_PROOF_WORKER_HEARTBEAT_MS="30000"
          export VEIL_PROOF_WORKER_IDLE_MS="2000"
          export VEIL_PROOF_WORKER_ERROR_MS="5000"
          export VEIL_REAL_E2E_ACKNOWLEDGE="true"

          timeout 330m npm run test:real-message-proof

      - name: Remove ephemeral fixture and stop container
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail

          docker rm -f veil-durable-message-prover \
            >/dev/null 2>&1 || true

          rm -f \
            "$RUNNER_TEMP/veil-real-message-proof-fixture.json" \
            "$RUNNER_TEMP/veil-shielded-message-summary.json" \
            "$RUNNER_TEMP/veil-shielded-message-error.json" \
            "$GITHUB_WORKSPACE/veil-account-preflight.json"

          echo "EPHEMERAL_DURABLE_MESSAGE_FIXTURE_REMOVED"
