name: Run VEIL Durable Message Proof E2E

on:
  workflow_dispatch:
    inputs:
      acknowledge_real_prover:
        description: Run the real official message prover through the durable Part 6 pipeline
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: veil-durable-message-proof-e2e
  cancel-in-progress: false

jobs:
  durable-message-proof:
    name: Durable Official Message Proof
    if: ${{ inputs.acknowledge_real_prover }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veil
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d veil"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/veil
      STARKNET_SEPOLIA_RPC_URL: ${{ secrets.STARKNET_SEPOLIA_RPC_URL }}
      VEIL_REAL_MESSAGE_FIXTURE_B64: ${{ secrets.VEIL_REAL_MESSAGE_FIXTURE_B64 }}
      PROVER_IMAGE: ghcr.io/dxjlabs/starknet-privacy-transaction-prover:privacy-0.14.3-rc.2-x86-64-v3

    steps:
      - name: Checkout VEIL source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${STARKNET_SEPOLIA_RPC_URL:-}" ]; then
            echo "STARKNET_SEPOLIA_RPC_URL is required."
            exit 1
          fi

          if [ -z "${VEIL_REAL_MESSAGE_FIXTURE_B64:-}" ]; then
            echo "VEIL_REAL_MESSAGE_FIXTURE_B64 is required."
            exit 1
          fi

          echo "Required secrets are present; values are not displayed."

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y postgresql-client >/dev/null

      - name: Build pinned VEIL backend and SDK
        run: npm run build:backend

      - name: Apply isolated migrations
        shell: bash
        run: |
          set -euo pipefail

          for migration in backend/migrations/*.sql; do
            echo "Applying $(basename "$migration")"
            psql "$DATABASE_URL" \
              -v ON_ERROR_STOP=1 \
              -f "$migration" \
              >/dev/null
          done

          psql "$DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -c "
              SELECT table_name
              FROM information_schema.tables
              WHERE table_schema = 'public'
                AND table_name = 'veil_proof_results';
            "

      - name: Decode and validate durable message fixture
        id: fixture
        shell: bash
        run: |
          set -euo pipefail

          fixture_path="$RUNNER_TEMP/veil-real-message-proof-fixture.json"

          printf '%s' "$VEIL_REAL_MESSAGE_FIXTURE_B64" \
            | base64 --decode \
            > "$fixture_path"

          chmod 600 "$fixture_path"

          node --input-type=module - "$fixture_path" <<'NODE'
          import { readFile } from "node:fs/promises";

          const path = process.argv[2];
          const value = JSON.parse(await readFile(path, "utf8"));

          if (
            typeof value !== "object"
            || value === null
            || Array.isArray(value)
            || value.schemaVersion !== "veil-real-message-proof-fixture-v1"
          ) {
            throw new Error(
              "The durable message proof fixture schema is invalid.",
            );
          }

          console.log("DURABLE_MESSAGE_FIXTURE_SCHEMA_VALID");
          NODE

          echo "path=$fixture_path" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull saved transaction prover
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$PROVER_IMAGE"
          docker image inspect "$PROVER_IMAGE" >/dev/null
          echo "SAVED_PROVER_IMAGE_READY"

      - name: Start official transaction prover
        shell: bash
        run: |
          set -euo pipefail

          docker rm -f veil-durable-message-prover \
            >/dev/null 2>&1 || true

          docker run -d \
            --name veil-durable-message-prover \
            -p 3000:3000 \
            -e RPC_URL="$STARKNET_SEPOLIA_RPC_URL" \
            -e CHAIN_ID="SN_SEPOLIA" \
            -e PROVER_IP="0.0.0.0" \
            -e PROVER_PORT="3000" \
            -e MAX_CONCURRENT_REQUESTS="1" \
            -e MAX_QUEUED_REQUESTS="1" \
            -e MAX_CONNECTIONS="2" \
            -e COMPILED_CLASS_CACHE_SIZE="50" \
            -e PREFETCH_STATE="false" \
            -e RUST_LOG="info" \
            "$PROVER_IMAGE"

          ready=0

          for attempt in $(seq 1 90); do
            if [ "$(
              docker inspect \
                -f '{{.State.Running}}' \
                veil-durable-message-prover \
                2>/dev/null || true
            )" != "true" ]; then
              echo "The prover container stopped before becoming ready."
              exit 1
            fi

            response="$(
              curl -sS \
                --connect-timeout 2 \
                --max-time 5 \
                -X POST http://127.0.0.1:3000 \
                -H 'Content-Type: application/json' \
                -d '{
                  "jsonrpc":"2.0",
                  "id":1,
                  "method":"starknet_specVersion",
                  "params":[]
                }' \
                2>/dev/null || true
            )"

            if echo "$response" | grep -q '"result"'; then
              ready=1
              break
            fi

            echo "Waiting for prover: $attempt/90"
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "The prover did not become ready."
            exit 1
          fi

          echo "OFFICIAL_TRANSACTION_PROVER_READY"

      - name: Run durable message proof pipeline
        shell: bash
        env:
          VEIL_REAL_MESSAGE_FIXTURE: ${{ steps.fixture.outputs.path }}
        run: |
          set -euo pipefail

          random_base64() {
            node --input-type=module -e \
              'import { randomBytes } from "node:crypto"; process.stdout.write(randomBytes(48).toString("base64"));'
          }

          payload_key="$(
            node --input-type=module -e \
              'import { randomBytes } from "node:crypto"; process.stdout.write(randomBytes(32).toString("base64"));'
          )"

          export STARKNET_CHAIN_ID="SN_SEPOLIA"
          export STARKNET_RPC_URL="$STARKNET_SEPOLIA_RPC_URL"

          export VEIL_PROVER_URL="http://127.0.0.1:3000"
          export VEIL_PROVER_MODE="local"
          export VEIL_EXPERIMENTAL_DIRECT_PROVER="true"
          export VEIL_DISCOVERY_URL="http://127.0.0.1:3000/api/indexer/messages"

          export VEIL_PRIVACY_POOL_ADDRESS="0x03a91bc44040f4173f30f3233d3cb2510aa05a0b74c22a5ee8240a313a0c8de5"
          export VEIL_CHANNEL_HELPER_ADDRESS="0x052390845931a0c8d4735246d853a1a514c3cbf88cb1714937284814c5e57b23"

          export VEIL_PROVER_CONNECTION_TIMEOUT_MS="5000"
          export VEIL_PROVER_JOB_TIMEOUT_MS="3600000"
          export VEIL_PROVER_TOTAL_TIMEOUT_MS="7200000"
          export VEIL_PROVER_HEALTH_RETRIES="1"
          export VEIL_PROVER_JOB_RETRIES="0"
          export VEIL_PROVER_RETRY_BASE_MS="250"
          export VEIL_PROVER_RETRY_MAX_MS="5000"

          export VEIL_PROOF_PAYLOAD_ACTIVE_KEY_VERSION="v1"
          export VEIL_PROOF_PAYLOAD_KEYS="{\"v1\":\"$payload_key\"}"

          export VEIL_RATE_LIMIT_SECRET="$(random_base64)"
          export VEIL_PROOF_ACCESS_SECRET="$(random_base64)"

          export VEIL_PROOF_QUEUE_MAX_QUEUED_JOBS="10"
          export VEIL_PROOF_QUEUE_MAX_RUNNING_JOBS="1"
          export VEIL_PROOF_QUEUE_RECOVERY_BATCH_SIZE="10"

          export VEIL_PROOF_WORKER_NAME="github-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export VEIL_PROOF_WORKER_SECRET="$(random_base64)"
          export VEIL_PROOF_WORKER_LEASE_MS="120000"
          export VEIL_PROOF_WORKER_HEARTBEAT_MS="30000"
          export VEIL_PROOF_WORKER_IDLE_MS="2000"
          export VEIL_PROOF_WORKER_ERROR_MS="5000"

          export VEIL_REAL_E2E_ACKNOWLEDGE="true"

          rm -f \
            "$GITHUB_WORKSPACE/veil-durable-message-proof-e2e-result.json" \
            "$GITHUB_WORKSPACE/veil-durable-message-proof-e2e.log"

          timeout 330m npm run test:real-message-proof \
            | tee "$GITHUB_WORKSPACE/veil-durable-message-proof-e2e.log"

      - name: Validate durable proof result
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module - \
            "$GITHUB_WORKSPACE/veil-durable-message-proof-e2e.log" \
            "$GITHUB_WORKSPACE/veil-durable-message-proof-e2e-result.json" \
            <<'NODE'
          import {
            readFile,
            writeFile,
          } from "node:fs/promises";

          const [
            logPath,
            outputPath,
          ] = process.argv.slice(2);

          const lines = (
            await readFile(
              logPath,
              "utf8",
            )
          )
            .split(/\r?\n/u)
            .map((line) => line.trim())
            .filter(Boolean)
            .reverse();

          let result;

          for (const line of lines) {
            try {
              const value = JSON.parse(line);

              if (
                value?.schemaVersion
                === "veil-real-message-proof-e2e-result-v1"
              ) {
                result = value;
                break;
              }
            } catch {
              // Ignore non-JSON command output.
            }
          }

          if (!result) {
            throw new Error(
              "The durable message proof result JSON was not emitted.",
            );
          }

          const expectedKeys = [
            "schemaVersion",
            "jobState",
            "proverStatus",
            "proofSizeBytes",
            "retryCount",
            "broadcastEnabled",
            "canonicalPrepared",
            "liveVerified",
            "shieldEnabled",
          ];

          if (
            JSON.stringify(
              Object.keys(result),
            )
            !== JSON.stringify(
              expectedKeys,
            )
          ) {
            throw new Error(
              "The durable message proof result contains unexpected fields.",
            );
          }

          if (
            result.jobState !== "succeeded"
            || result.proverStatus
              !== "LOCAL_PROVER_VERIFIED"
            || !Number.isSafeInteger(
              result.proofSizeBytes,
            )
            || result.proofSizeBytes < 1
            || result.broadcastEnabled !== false
            || result.canonicalPrepared !== false
            || result.liveVerified !== false
            || result.shieldEnabled !== false
          ) {
            throw new Error(
              "The durable message proof verdict is invalid.",
            );
          }

          await writeFile(
            outputPath,
            `${JSON.stringify(
              result,
              null,
              2,
            )}\n`,
            {
              encoding:
                "utf8",

              mode:
                0o600,
            },
          );

          console.log(
            "VEIL_DURABLE_MESSAGE_PROOF_E2E_SUCCEEDED",
          );
          NODE

      - name: Save redacted prover logs and stop container
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail

          docker logs veil-durable-message-prover \
            2>&1 \
            | awk \
              'BEGIN { IGNORECASE = 1 } !/(private[_ -]?key|viewing[_ -]?key|signature|secret|calldata|proof)/' \
            > "$GITHUB_WORKSPACE/veil-durable-message-prover.log" \
            || true

          docker rm -f veil-durable-message-prover \
            >/dev/null 2>&1 || true

          rm -f \
            "$RUNNER_TEMP/veil-real-message-proof-fixture.json"

      - name: Upload safe durable proof result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: veil-durable-message-proof-e2e
          if-no-files-found: warn
          retention-days: 7
          path: |
            veil-durable-message-proof-e2e-result.json
            veil-durable-message-proof-e2e.log
            veil-durable-message-prover.log
